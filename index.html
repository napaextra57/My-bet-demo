<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afi Premium - Management System</title>
    <style>
        body { font-family: sans-serif; background-color: #0b0f19; color: white; margin: 0; }
        .view { display: none; padding: 20px; }
        .active { display: block; }
        .panel-btn { background: #3b82f6; padding: 15px; margin: 10px 0; border-radius: 8px; cursor: pointer; text-align: center; }
        #login-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:#0b0f19; z-index:9999; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="background:#111827; padding:25px; border-radius:12px; width:80%; max-width:300px; border:1px solid #334155; text-align:center;">
        <h2 style="margin-bottom:20px;">Login Panel</h2>
        <select id="role-select" style="width:100%; padding:10px; margin-bottom:10px;">
            <option value="user">User</option>
            <option value="master">Master Agent</option>
            <option value="super">Super Agent</option>
        </select>
        <input type="text" id="username" placeholder="Username" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="password" id="password" placeholder="Password" style="width:100%; padding:10px; margin-bottom:20px;">
        <button onclick="checkLogin()" style="width:100%; padding:12px; background:#ef4444; border:none; color:white; cursor:pointer;">Login</button>
    </div>
</div>

<div id="super-panel" class="view">
    <h1>Super Agent Panel</h1>
    <div class="panel-btn">Create Master Agent Account</div>
    <div class="panel-btn">View All Masters & Balances</div>
</div>

<div id="master-panel" class="view">
    <h1>Master Agent Panel</h1>
    <div class="panel-btn">Create User Account</div>
    <div class="panel-btn">Manage User Deposits/Withdrawals</div>
</div>

<div id="user-panel" class="view">
    <h1>Welcome, User!</h1>
    <div class="panel-btn">Live Sports Dashboard</div>
    <div class="panel-btn">Aviator Game</div>
</div>

<script>
    function checkLogin() {
        const role = document.getElementById('role-select').value;
        document.getElementById('login-overlay').style.display = 'none';
        
        // রোল অনুযায়ী প্যানেল দেখানো
        if(role === 'super') switchView('super-panel');
        else if(role === 'master') switchView('master-panel');
        else switchView('user-panel');
    }

    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }
</script>

</body>
</html>
