<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afi Premium Sports - Live Odds</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #111827 0%, #1e1b4b 100%);
            padding: 25px 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-bottom: 3px solid var(--accent-yellow);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        header p {
            margin: 8px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .section-header {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin: 25px 0 12px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .sport-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .sport-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px -1px rgba(0, 0, 0, 0.4);
            border-color: #374151;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: bold;
            text-transform: uppercase;
        }

        .live-badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--accent-green);
            font-size: 10px;
        }

        .teams {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .odds-container {
            display: flex;
            gap: 10px;
        }

        .odds-box {
            flex: 1;
            background-color: rgba(7, 10, 19, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .odds-box:hover {
            background-color: var(--accent-blue);
            border-color: #60a5fa;
            color: #fff;
        }

        .odds-box:hover .odds-name {
            color: rgba(255, 255, 255, 0.8);
        }

        .odds-box:hover .odds-val {
            color: #fff;
        }

        .odds-name {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .odds-val {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .loading, .error-msg, .no-match {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .error-msg {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Afi Premium Sports</h1>
        <p>বিশ্বমানের বুকমেকারদের থেকে রিয়েল-টাইম আন্তর্জাতিক ম্যাচের আসল লাইভ বেটিং অডস</p>
    </header>

    <div class="section-header">⚽ আন্তর্জাতিক ফুটবল (Soccer)</div>
    <div id="football-list">
        <div class="loading">লাইভ ফুটবল ডাটা লোড হচ্ছে...</div>
    </div>

    <div class="section-header">🎾 ওয়ার্ল্ড টেনিস (Tennis ATP)</div>
    <div id="tennis-list">
        <div class="loading">লাইভ টেনিস ডাটা লোড হচ্ছে...</div>
    </div>
</div>
