

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afi Premium Sports - Live Odds</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #111827 0%, #1e1b4b 100%);
            padding: 25px 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-bottom: 3px solid var(--accent-yellow);
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        header p {
            margin: 8px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .section-header {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-blue);
            margin: 25px 0 12px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .sport-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .sport-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px -1px rgba(0, 0, 0, 0.4);
            border-color: #374151;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: bold;
            text-transform: uppercase;
        }

        .live-badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid var(--accent-green);
            font-size: 10px;
        }

        .sport-tag {
            background-color: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
        }

        .teams {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .odds-container {
            display: flex;
            gap: 10px;
        }

        .odds-box {
            flex: 1;
            background-color: rgba(7, 10, 19, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .odds-box:hover {
            background-color: var(--accent-blue);
            border-color: #60a5fa;
            color: #fff;
        }

        .odds-box:hover .odds-name {
            color: rgba(255, 255, 255, 0.8);
        }

        .odds-box:hover .odds-val {
            color: #fff;
        }

        .odds-name {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .odds-val {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .loading, .error-msg, .no-match {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .error-msg {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.2);
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 40px;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Afi Premium Sports</h1>
        <p>বিশ্বমানের বুকমেকারদের থেকে রিয়েল-টাইম আন্তর্জাতিক ম্যাচের আসল লাইভ ও আপকামিং বেটিং অডস</p>
    </header>

    <div class="section-header">🔥 গ্লোবাল লাইভ ও আপকামিং ম্যাচসমূহ (Live & Upcoming Odds)</div>
    <div id="odds-list">
        <div class="loading">লাইভ স্পোর্টস ডাটা লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</div>
    </div>
    
    <div class="footer">
        © 2026 Afi Premium Sports. Powered by The Odds API.
    </div>
</div>

<script>
    // আপনার অ্যাক্টিভ API Key
    const API_KEY = 'ec75c1d76f8f59e9ade916990fc878f6'; 

    async function fetchUpcomingOdds() {
        // 'upcoming' এবং 'regions=eu' ব্যবহারের মাধ্যমে সঠিক দশমিক আন্তর্জাতিক অডস লোড হবে
        const url = `https://api.the-odds-api.com/v4/sports/upcoming/odds/?regions=eu&oddsFormat=decimal&apiKey=${API_KEY}`;
        
        try {
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`API Error: ${response.status} ${response.statusText}`);
            }

            const data = await response.json();
            const container = document.getElementById('odds-list');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="no-match">এই মুহূর্তে কোনো ম্যাচ লাইভ বা আপকামিং পাওয়া যায়নি।</div>';
                return;
            }

            // সর্বোচ্চ ৮টি লাইভ/আপকামিং ম্যাচ ড্যাশবোর্ডে সুন্দরভাবে সাজানো
            data.slice(0, 8).forEach(match => {
                const homeTeam = match.home_team;
                const awayTeam = match.away_team;
                const sportTitle = match.sport_title || "Sports";
                
                let homeOdds = 'N/A';
                let awayOdds = 'N/A';
                let drawOdds = 'N/A';

                if (match.bookmakers && match.bookmakers.length > 0) {
                    // প্রথম বুকমেকারের (সাধারণত Pinnacle বা 1xBet) ডাটা নিয়ে আসা হচ্ছে
                    const market = match.bookmakers[0].markets.find(m => m.key === 'h2h');
                    if (market) {
                        const homeOutcome = market.outcomes.find(o => o.name === homeTeam);
                        const awayOutcome = market.outcomes.find(o => o.name === awayTeam);
                        const drawOutcome = market.outcomes.find(o => o.name === 'Draw');

                        if (homeOutcome) homeOdds = homeOutcome.price.toFixed(2);
                        if (awayOutcome) awayOdds = awayOutcome.price.toFixed(2);
                        if (drawOutcome) drawOdds = drawOutcome.price.toFixed(2);
                    }
                }

                // অডস জেনারেট করা
                let oddsHtml = `
                    <div class="odds-box">
                        <span class="odds-name">${homeTeam}</span>
                        <span class="odds-val">${homeOdds}</span>
                    </div>
                `;
                
                if (drawOdds !== 'N/A') {
                    oddsHtml += `
                        <div class="odds-box">
                            <span class="odds-name">Draw</span>
                            <span class="odds-val">${drawOdds}</span>
                        </div>
                    `;
                }

                oddsHtml += `
                    <div class="odds-box">
                        <span class="odds-name">${awayTeam}</span>
                        <span class="odds-val">${awayOdds}</span>
                    </div>
                `;

                // ম্যাচ কার্ডের স্ট্রাকচার
                const matchHtml = `
                    <div class="sport-section">
                        <div class="match-header">
                            <span class="sport-tag">${sportTitle}</span>
                            <span class="live-badge">● LIVE / UPCOMING</span>
                        </div>
                        <div class="teams">${homeTeam} vs ${awayTeam}</div>
                        <div class="odds-container">${oddsHtml}</div>
                    </div>
                `;
                container.innerHTML += matchHtml;
            });
        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('odds-list').innerHTML = `
                <div class="error-msg">
                    <strong>ডাটা লোড করতে ব্যর্থ হয়েছে!</strong><br>
                    <span style="font-size: 12px; color: var(--text-muted);">${error.message}</span>
                </div>`;
        }
    }

    // পেজ লোড হবার সাথে সাথে লাইভ রান করা
    fetchUpcomingOdds();
</script>

</body>
</html>
